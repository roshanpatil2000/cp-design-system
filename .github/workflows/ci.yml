name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Generated Atlassian tokens are up to date
        run: yarn workspace cp-design-system sync-tokens && git diff --exit-code -- packages/cp-design-system/src/tokens
      - run: yarn lint
      - run: yarn format:check
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      - name: Worklets in the native build are device-safe
        run: yarn workspace cp-design-system check:worklets
